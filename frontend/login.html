<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Intelligent Parent Dashboard</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-wrapper">

        <div class="login-card">

            <div class="brand-header">
                <h2>Intelligent School Portal</h2>
                <p>Sign in to access your dashboard</p>
            </div>

            <div
                id="error-message"
                class="alert-error"
                style="display: none;">
            </div>

            <form id="login-form">

                <div class="form-group">
                    <label for="username">
                        Email or Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="e.g. parent@school.ac.ke"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required>
                </div>

                <button
                    type="submit"
                    id="submit-btn"
                    class="btn btn-primary btn-block">
                    Sign In
                </button>

            </form>

            <div class="login-footer">
                <p>
                    System Roles:
                    <strong>Admin | Teacher | Parent</strong>
                </p>
            </div>

        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
